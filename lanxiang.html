    copy:"你可能不是那个一拍桌子就要改变世界的人，但你很可能是团队里确保事情不会乱成一团的人。别人想一步登天，你先检查楼梯有没有装好；别人准备临时起意，你已经想到了三个风险预案。你的稳健是优势，但人生也不是每次更新都需要等到绝对安全。偶尔允许自己试错，你会发现，有些好机会本来就不会提前通知你。"
  }
};

/* ========== 逻辑 ========== */
let current = 0;
let answers = [];

function startQuiz(){
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("quizPage").classList.remove("hidden");
  current = 0; answers = [];
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[current];
  document.getElementById("qNum").textContent = `第 ${current+1} / ${QUESTIONS.length} 题`;
  document.getElementById("qText").textContent = q.text;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(i);
    box.appendChild(btn);
  });
  document.getElementById("progressBar").style.width = (current / QUESTIONS.length * 100) + "%";
}

function selectOption(i){
  answers[current] = i;
  const btns = document.querySelectorAll(".opt");
  btns.forEach((b, idx) => b.classList.toggle("selected", idx === i));
  setTimeout(() => {
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      document.getElementById("progressBar").style.width = "100%";
      showResult();
    }
  }, 220);
}

function showResult(){
  // 统计得分
  const scores = {};
  Object.keys(CHARACTERS).forEach(k => scores[k] = 0);
  answers.forEach((ansIdx, qIdx) => {
    const sc = QUESTIONS[qIdx].options[ansIdx].scores;
    for (const k in sc) scores[k] += sc[k];
  });
  // 找最高分（平局时看最后一题倾向）
  let max = -1, winner = null;
  const lastScores = QUESTIONS[QUESTIONS.length-1].options[answers[answers.length-1]].scores;
  for (const k in scores){
    if (scores[k] > max || (scores[k] === max && lastScores[k])){
      max = scores[k]; winner = k;
    }
  }
  const c = CHARACTERS[winner];
  document.getElementById("rName").textContent = c.name;
  document.getElementById("rType").textContent = c.type;
  document.getElementById("rTags").innerHTML = c.tags.map(t => `<span class="tag">${t}</span>`).join("");
  document.getElementById("rFun").textContent = c.fun;
  document.getElementById("rPos").textContent = c.pos;
  document.getElementById("rCore").textContent = c.core;
  document.getElementById("rLove").textContent = c.love;
  document.getElementById("rWork").textContent = c.work;
  document.getElementById("rWeak").textContent = c.weak;
  document.getElementById("rCopy").textContent = c.copy;

  document.getElementById("quizPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");
  window.scrollTo(0,0);
}
</script>
