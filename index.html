var CHARACTERS = {
  xulanxiang:{name:"许兰香 / 沈嘉兰",type:"逆风翻盘型人格",tags:["坚韧","聪慧","隐忍","清醒"],fun:"人间清醒·逆袭版",pos:"表面不争，内心有数；不靠抱怨改变处境，而是靠能力和耐心拿回主动权。",core:"心思细腻，观察力强，遇事不急着暴露底牌。她能体谅别人，但不会永远牺牲自己；善良是底色，清醒是保护自己的方式。",love:"不只追求心动，更看重尊重、信任和实际行动。可以慢慢爱上一个人，但不会为了爱情放弃自我。",work:"擅长从复杂环境中寻找突破口，先了解规则，再寻找改变规则的机会。",weak:"太习惯自己扛事，不愿轻易示弱。有时明明可以求助，却非要一个人把困难打通关。",copy:"你属于那种开局被发了一手烂牌，却能默默研究规则、攒够筹码，最后把牌桌重新洗一遍的人。别人以为你在忍气吞声，其实你在收集证据、规划路线、等待时机。你最大的本事不是从不跌倒，而是每次跌倒之后，都更知道下一步怎么走。记住：你不需要永远坚强，也不必每次都独自通关。"},
  linjinqi:{name:"林锦岐",type:"冷面理性型人格",tags:["克制","责任","判断力","慢热"],fun:"情绪已读，回复待审批",pos:"外表冷静，内心有自己的衡量标准，习惯先权衡局势再做决定。",core:"理性、自律、谨慎，重视责任与秩序。面对复杂局面，倾向于控制情绪、分析利弊。",love:"慢热，不擅长及时表达。容易把责任和现实放在感情前面，但真正认定一个人后，会用行动承担责任。",work:"先分析风险、再制定方案，适合管理、决策、谈判和需要承担责任的岗位。",weak:"过度权衡容易错过时机；以为自己是在理性处理问题，别人却可能觉得你冷漠、不解释。",copy:"你不是没有情绪，你只是习惯先把情绪放进文件夹，再处理眼前的问题。别人吵架靠提高音量，你靠沉默、分析和一句这件事我们之后再谈。你的可靠是真的，你的嘴硬也是真的。友情提醒：感情不是项目审批流程，有些话今天不说，明天可能就没有机会说了。"},
  zhaoxingtang:{name:"赵星棠",type:"清醒自保型人格",tags:["自尊","现实","独立","边界感"],fun:"爱情可以暂停，存款不能停",pos:"不轻易把人生寄托在别人身上，知道自己需要什么，也知道如何为自己留后路。",core:"骄傲、敏锐、务实，有较强的自我保护意识。看得见现实的限制，也不愿轻易认输。",love:"爱情不是人生的唯一答案。她需要尊重、体面和选择权，不愿只为了维持关系而委屈自己。",work:"关注资源、利益和实际回报，善于为自己争取空间。",weak:"太害怕失去主动权时，可能把真心藏得太深；有时会把求助也看成一种示弱。",copy:"你属于那种就算感情出了问题，也会先把自己的生活安排明白的人。别人还在问他为什么不爱我，你已经开始研究财务规划和未来路线。你不是不需要爱，而是不愿为了得到爱，连自己是谁都忘了。唯一需要注意的是：独立不是凡事都得自己扛，偶尔相信一个值得的人，并不会让你输掉人生。"},
  ducuique:{name:"杜翠雀",type:"野心谋局型人格",tags:["目标感","竞争","敏锐","胜负心"],fun:"事业心开了八倍速",pos:"不甘于现状，渴望改变自己的位置；目标越明确，行动越有方向。",core:"有野心、竞争意识强，善于观察机会。她的故事也体现了当目标压过底线时，野心可能变成危险的执念。",love:"容易把喜欢、认可与被选择联系在一起，既渴望亲密，也在意自己是不是那个赢的人。",work:"目标导向，重视上升空间，善于发现机会。",weak:"太想证明自己时，容易忽略长期信任与行为底线；把一次失败看成整个人生的失败。",copy:"你不是没有野心，你是连休息的时候都觉得自己是不是落后了。别人说随缘，你心里已经列好了三年计划、五个备选方案和一个绝不告诉别人的终极目标。你的冲劲确实能带你走得很远，但别把所有人都当竞争对手。真正厉害的人，不只知道怎么赢，也知道哪些东西不值得拿来交换。"},
  xueguihua:{name:"薛桂花",type:"温暖守护型人格",tags:["善良","忠诚","担当","保护欲"],fun:"全队指定家长",pos:"不一定最会说漂亮话，却愿意在别人最需要帮助时站出来。",core:"朴实、坚韧、重情义，愿意用实际行动保护重要的人。",love:"看重陪伴、责任和患难中的支持。比起浪漫承诺，更相信日复一日的照顾。",work:"踏实可靠，善于照顾团队、处理具体问题。",weak:"容易把别人的需求放在自己前面，甚至觉得自己吃苦是理所当然。",copy:"你可能不是朋友圈里最会讲道理的人，却往往是别人出事后第一个被想起来的人。你会记得朋友不吃什么，会在别人嘴硬说没事时多问一句，也会默默把麻烦处理好。你是很多人的安全感来源。不过请记住，你不是全天候免费客服。照顾别人很重要，照顾自己也不是自私。"},
  hanliang:{name:"韩粱",type:"深情务实型人格",tags:["专一","行动","上进","克制"],fun:"深情不打烊，人生继续营业",pos:"愿意认真对待感情，也能在现实受挫后继续走自己的路。",core:"踏实、上进、重情义，愿意通过学习和行动改变处境。面对感情挫折，倾向于把精力重新放回人生目标。",love:"认真、长情，喜欢一个人时愿意付出，但也需要学会接受并非所有感情都能如愿。",work:"靠能力积累机会，重视长期发展，不太依赖投机取巧。",weak:"容易把忍耐当作成熟，把遗憾独自消化；有时过于执着于只要努力就能改变一切。",copy:"你是那种失恋以后会难过，但第二天还是照常上班、学习、努力生活的人。你不会轻易否定过去的真心，也不愿让一次遗憾毁掉整个人生。你最大的优点，是对感情认真、对未来负责；你的难题，是总觉得自己再努力一点，就能把所有事情都挽回来。记住，认真爱过不是失败，继续向前也不是背叛过去。"},
  linxiuwan:{name:"林绣芄",type:"敏感成长型人格",tags:["感性","在意评价","情感需求","成长"],fun:"对方少回一个字，我能分析一晚上",pos:"对周围人的态度比较敏感，容易被关系影响，但也有机会在经历中逐渐认清自己。",core:"感受力强，重视亲近之人的评价。遇到不确定的事情，容易反复琢磨别人的话。",love:"希望被重视、被肯定，容易因为对方的态度变化而患得患失。",work:"在氛围友好、反馈清晰的团队中更容易发挥；受到鼓励时，往往更有动力。",weak:"容易把别人的冷淡理解成自己的问题，也可能为了获得认可而改变原本的想法。",copy:"你不是想太多，你只是大脑的情绪分析系统配置得特别齐全。对方一句嗯，你能推演出三种态度、五种原因和八个可能的结局。但别忘了，别人不高兴未必是你的错，别人不回复也不等于你不重要。你真正的成长，不是变得毫不在乎，而是终于能够在意别人，同时不丢掉自己。"},
  yuchan:{name:"玉蝉",type:"环境观察型人格",tags:["谨慎","适应力","观察","风险意识"],fun:"全场还没开口，你已经看完局势了",pos:"不急于出头，先观察环境和规则，再决定怎么行动。",core:"谨慎细心，懂得根据环境调整自己的行为。面对陌生人和复杂局面，会先判断是否安全。",love:"不轻易交出信任，更希望通过长期相处确认对方是否可靠。",work:"擅长观察团队氛围、发现潜在风险、适应不同的工作方式。",weak:"过度谨慎可能导致犹豫不决；总在观察别人，却忘了主动表达自己的需求。",copy:"你进一个新群，别人忙着打招呼，你已经默默搞清楚谁最靠谱、谁爱甩锅、谁说话需要打八折。你不是胆小，只是习惯先确认地形再出发。你的观察力是优势，但也别把人生过成一场永不结束的风险评估。有时候，不必等到百分之百确定，也可以勇敢迈出第一步。"},
  linxiulai:{name:"林绣莱",type:"温柔觉醒型人格",tags:["温和","忍耐","边界","独立"],fun:"嘴上说都行，心里已经开庭三次",pos:"习惯顾及别人，但内心并不愿意永远退让；成长的关键是学会为自己作决定。",core:"温和、顾全大局，容易考虑周围人的感受。遇到冲突时通常先忍耐，等到想清楚后才会表达立场。",love:"希望关系稳定和谐，愿意为伴侣着想，但也需要学习分辨包容与委屈自己的区别。",work:"合作意识强，愿意配合团队；当边界清晰时，能够成为稳定的协作者。",weak:"容易把大家都满意当作自己的责任，直到忍无可忍才一次性爆发。",copy:"你经常说没关系、都可以、你决定就好，但你的内心并不是真的没有想法。你只是太习惯让别人舒服，偶尔连自己都排到了最后。好消息是，你不需要突然变成一个强势的人才能改变生活。学会说一次不，表达一次真实想法，就是成长的开始。温柔可以保留，边界也应该拥有。"},
  xiaolian:{name:"小莲",type:"快乐生活型人格",tags:["知足","松弛","日常幸福","随和"],fun:"人生 KPI：按时吃饭，准时下班",pos:"不一定非要赢过所有人，更愿意珍惜生活里实实在在的小快乐。",core:"重视当下体验，不愿把每一天都过成竞争。能够从日常生活中寻找乐趣。",love:"比起惊天动地的浪漫，更喜欢舒服、自然、能一起吃饭聊天的关系。",work:"喜欢目标明确、氛围友好、生活与工作相对平衡的环境。",weak:"有时容易回避长期规划，遇到困难可能先想着躲一躲再说。",copy:"别人忙着逆袭、升职、成为人生赢家，你先确认今天有没有好好吃饭。你并不是没有追求，只是知道人生不应该只有成绩单。能睡个好觉、和喜欢的人说说话、周末吃一顿满意的饭，对你而言都是值得认真对待的幸福。唯一要注意的是，松弛不等于逃避。该面对的问题，还是要找个合适的日子处理掉——不能一直等到下辈子。"},
  gantang:{name:"甘棠",type:"自我觉醒型人格",tags:["尊严","独立意识","自我认同","选择权"],fun:"我的人生，不接受代写",pos:"不愿永远按照别人的期待生活，逐渐学会表达真实的自己。",core:"重视自我价值，不希望被身份、环境或他人的评价限制。面对不公平时，内心有争取改变的动力。",love:"希望得到平等的尊重，而不是仅仅被需要。真正的亲密关系应该让双方都能做自己。",work:"希望自己的努力被看见，也需要一定的自主空间。",weak:"过于在意别人是否尊重自己时，可能把普通的意见分歧也理解成否定。",copy:"你的人生可能经历过太多别人觉得你应该怎样，所以你越来越想知道自己真正想要什么。你不一定总是最勇敢的那个，但你正在学会不再把选择权全部交给别人。你可以听取建议，可以暂时妥协，但最终的人生方向应该由你自己决定。友情提醒：不必为了证明自己独立，就拒绝所有帮助。接受善意，也是一种自由。"},
  linxiushu:{name:"林绣菽",type:"稳健自持型人格",tags:["谨慎","秩序感","稳妥","风险控制"],fun:"人生信条：能稳定运行，就别随便更新",pos:"相比冒险和出风头，更倾向于在现有条件下寻找稳妥的解决办法。",core:"偏稳健、重视秩序的人格类型。比起突然改变一切，更倾向于先了解情况，再做选择。",love:"偏好稳定、可靠、说到做到的关系。比起短暂的激情，更看重长期相处是否安心。",work:"擅长按步骤完成任务，重视流程和细节。",weak:"过度追求稳妥时，容易错过机会；有时因为害怕出错，而不敢尝试新的方法。",copy:"你可能不是那个一拍桌子就要改变世界的人，但你很可能是团队里确保事情不会乱成一团的人。别人想一步登天，你先检查楼梯有没有装好；别人准备临时起意，你已经想到了三个风险预案。你的稳健是优势，但人生也不是每次更新都需要等到绝对安全。偶尔允许自己试错，你会发现，有些好机会本来就不会提前通知你。"}

var current = 0;
var answers = [];

function startQuiz(){
  document.getElementById("startPage").classList.add("hidden");
  document.getElementById("quizPage").classList.remove("hidden");
  current = 0;
  answers = [];
  renderQuestion();
}

function renderQuestion(){
  var q = QUESTIONS[current];
  document.getElementById("qNum").textContent = "第 " + (current+1) + " / " + QUESTIONS.length + " 题";
  document.getElementById("qText").textContent = q.text;
  var box = document.getElementById("options");
  box.innerHTML = "";
  for (var i = 0; i < q.options.length; i++){
    var btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = q.options[i].text;
    btn.setAttribute("data-idx", i);
    btn.onclick = function(){
      selectOption(parseInt(this.getAttribute("data-idx")));
    };
    box.appendChild(btn);
  }
  document.getElementById("progressBar").style.width = (current / QUESTIONS.length * 100) + "%";
}

function selectOption(i){
  answers[current] = i;
  var btns = document.querySelectorAll(".opt");
  for (var j = 0; j < btns.length; j++){
    btns[j].className = (j === i) ? "opt selected" : "opt";
  }
  setTimeout(function(){
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      document.getElementById("progressBar").style.width = "100%";
      showResult();
    }
  }, 220);
}

function showResult(){
  var scores = {};
  var keys = Object.keys(CHARACTERS);
  for (var i = 0; i < keys.length; i++) scores[keys[i]] = 0;

  for (var q = 0; q < answers.length; q++){
    var sc = QUESTIONS[q].options[answers[q]].scores;
    for (var k in sc){
      if (scores[k] !== undefined) scores[k] += sc[k];
    }
  }

  var scoreList = [];
  for (var i2 = 0; i2 < keys.length; i2++){
    scoreList.push({ key: keys[i2], score: scores[keys[i2]] });
  }
  scoreList.sort(function(a, b){ return b.score - a.score; });

  var winner = scoreList[0].key;
  if (scoreList.length > 1 && scoreList[0].score === scoreList[1].score){
    var lastScores = QUESTIONS[QUESTIONS.length - 1].options[answers[answers.length - 1]].scores;
    var maxScore = scoreList[0].score;
    var tied = [];
    for (var i3 = 0; i3 < scoreList.length; i3++){
      if (scoreList[i3].score === maxScore) tied.push(scoreList[i3].key);
    }
    for (var i4 = 0; i4 < tied.length; i4++){
      if (lastScores[tied[i4]]){ winner = tied[i4]; break; }
    }
  }

  var c = CHARACTERS[winner];
  if (!c) { alert("匹配出错，请重试"); return; }

  document.getElementById("rName").textContent = c.name;
  document.getElementById("rType").textContent = c.type;

  var tagHtml = "";
  for (var t = 0; t < c.tags.length; t++){
    tagHtml += '<span class="tag">' + c.tags[t] + '</span>';
  }
  document.getElementById("rTags").innerHTML = tagHtml;

  document.getElementById("rFun").textContent = c.fun;
  document.getElementById("rPos").textContent = c.pos;
  document.getElementById("rCore").textContent = c.core;
  document.getElementById("rLove").textContent = c.love;
  document.getElementById("rWork").textContent = c.work;
  document.getElementById("rWeak").textContent = c.weak;
  document.getElementById("rCopy").textContent = c.copy;

  document.getElementById("quizPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");
  window.scrollTo(0,0);
}

document.getElementById("startBtn").onclick = startQuiz;
